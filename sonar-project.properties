# SonarCloud Organization & Project Key
sonar.organization=ankit44881
sonar.projectKey=Ankit44881_order-management-app

# Project Metadata
sonar.projectName=Chai Politics Application
sonar.projectVersion=1.0

# Source Code & Tests Mapping
sonar.sources=backend
sonar.tests=backend/tests
sonar.exclusions=**/venv/**, **/__pycache__/**, **/database/**

# Encoding & Language
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10

# Quality Gate Result Check (Fails build in GitHub Actions if Quality Gate fails)
sonar.qualitygate.wait=true

# Coverage Report Path
sonar.python.coverage.reportPaths=coverage.xml