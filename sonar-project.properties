# Project Metadata
sonar.projectKey=Ankit44881_order-management-app
sonar.projectName=Chai Politics Application
sonar.projectVersion=1.0

# Scan Entire Repository from Root
sonar.sources=.

# Map Tests Explicitly
sonar.tests=backend/tests

# Exclusions (Disjoint Sets Fix: Tests & Unwanted Directories Excluded from Source Scanning)
sonar.exclusions=backend/tests/**, **/venv/**, **/__pycache__/**, **/database/**, **/*.xml

# Encoding & Language
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10

# Coverage Report Path
sonar.python.coverage.reportPaths=coverage.xml