name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: "project-e88d1c23-e44c-4d58-8dd"
  GAR_LOCATION: "us-central1"
  GAR_REPOSITORY: "om-app-repo"
  GKE_CLUSTER: "gke-cluster"
  GKE_LOCATION: "us-central1-b"
  
  # GCP Artifact Registry Image Base URLs
  FRONTEND_IMAGE: "us-central1-docker.pkg.dev/project-e88d1c23-e44c-4d58-8dd/om-app-repo/chai-politics-frontend"
  BACKEND_IMAGE: "us-central1-docker.pkg.dev/project-e88d1c23-e44c-4d58-8dd/om-app-repo/chai-politics-backend"

jobs:
  devsecops-pipeline:
    runs-on: [self-hosted, Linux, X64]

    permissions:
      contents: read
      id-token: write  # Needed for GCP Workload Identity Federation
      security-events: write  # important for SARIF upload 

    steps:
      # ---------------------------------------------------------
      # 0. CHECKOUT CODE & CALCULATE SHORT SHA
      # ---------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Set Short SHA Variable
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # 1. AUTOMATED UNIT TESTS & COVERAGE REPORT
      # ---------------------------------------------------------
      - name: Run Unit Tests & Generate Coverage
        env:
          PYTHONPATH: .
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov
          pytest backend/tests/ --cov=backend --cov-report=xml:coverage.xml

      # ---------------------------------------------------------
      # 2. SELF-HOSTED SONARQUBE SAST SCAN & QUALITY GATE CHECK
      # ---------------------------------------------------------
      - name: SonarQube Scan & Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ---------------------------------------------------------
      # 3. FRONTEND: Generate Dynamic version.json
      # ---------------------------------------------------------
      - name: Generate Dynamic version.json
        run: |
          IST_TIME=$(python3 -c "from datetime import datetime, timezone, timedelta; print((datetime.now(timezone.utc) + timedelta(hours=5, minutes=30)).strftime('%Y-%m-%d %I:%M:%S %p IST'))")

          cat > ./frontend/version.json <<EOF
          {
            "application": "Chai Politics",
            "version": "1.0.${{ github.run_number }}",
            "imageTag": "${{ env.SHORT_SHA }}",
            "commit": "${{ env.SHORT_SHA }}",
            "environment": "Production",
            "cluster": "${{ env.GKE_CLUSTER }}",
            "deployedAt": "${IST_TIME}"
          }
          EOF
          echo "Generated version.json:"
          cat ./frontend/version.json

      # ---------------------------------------------------------
      # 4. AUTHENTICATE TO GCP VIA WORKLOAD IDENTITY FEDERATION
      # ---------------------------------------------------------
      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA }}

      - name: Set up Cloud SDK & Docker Auth for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # ---------------------------------------------------------
      # 5. BUILD DOCKER IMAGES USING SHORT SHA
      # ---------------------------------------------------------
      - name: Build Frontend & Backend Images
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }}:${{ env.SHORT_SHA }} ./frontend
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ env.SHORT_SHA }} ./backend

     # ---------------------------------------------------------
      # 6. TRIVY IMAGES SCANNING (SEPARATE SUMMARY REPORTS)
      # ---------------------------------------------------------
      - name: Scan Frontend Image & Append to Summary
        if: always()
        run: |
          echo "## 🎨 Frontend Image Scan Report (\`${{ env.FRONTEND_IMAGE }}:${{ env.SHORT_SHA }}\`)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --vuln-type os,library ${{ env.FRONTEND_IMAGE }}:${{ env.SHORT_SHA }} >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Scan Backend Image & Append to Summary
        if: always()
        run: |
          echo "## ⚙️ Backend Image Scan Report (\`${{ env.BACKEND_IMAGE }}:${{ env.SHORT_SHA }}\`)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --vuln-type os,library ${{ env.BACKEND_IMAGE }}:${{ env.SHORT_SHA }} >>$GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      # ---------------------------------------------------------
      # 7. PUSH DOCKER IMAGES TO GCP REGISTRY USING SHORT SHA
      # ---------------------------------------------------------
      - name: Push Frontend & Backend Image
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ env.SHORT_SHA }}
          docker push ${{ env.BACKEND_IMAGE }}:${{ env.SHORT_SHA }}

      # ---------------------------------------------------------
      # 8. DEPLOY TO GKE USING SHORT SHA
      # ---------------------------------------------------------
      - name: Set up GKE Credentials & kubectl
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}

      - name: Deploy & Manage Kubernetes Stateful Infrastructure
        run: |
          # 1. Apply Kubernetes Manifests
          kubectl apply -f kubernetes/ --recursive

          # 2. Wait for MySQL StatefulSet readiness
          echo "=== WAITING FOR MYSQL STATEFULSET ==="
          kubectl rollout status statefulset/mysql --timeout=180s

          # 3. Auto-initialize Database Schema if needed
          echo "=== CHECKING & INITIALIZING DATABASE SCHEMA ==="
          kubectl exec -i mysql-0 -- mysql -u chai_admin -pUserPassword123 chaipolitics_db < database/schema.sql || true

          # 4. Update Deployments with new container images from Artifact Registry
          kubectl set image deployment/frontend frontend=${{ env.FRONTEND_IMAGE }}:${{ env.SHORT_SHA }}
          kubectl set image deployment/backend backend=${{ env.BACKEND_IMAGE }}:${{ env.SHORT_SHA }}

          # 5. Wait for App Rollouts to complete
          kubectl rollout status deployment/frontend --timeout=120s
          kubectl rollout status deployment/backend --timeout=120s

          echo "------------------------------------------"
          echo "=== CURRENTLY RUNNING DEPLOYMENT IMAGES ==="
          echo "Frontend Image: $(kubectl get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "Backend Image:  $(kubectl get deployment backend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "------------------------------------------"

          # 6. Print Live Resources Status
          echo "=== LIVE PODS ==="
          kubectl get pods -o wide
          echo "=== LIVE PVC & STATEFULSETS ==="
          kubectl get pvc,statefulset
          echo "=== LIVE SERVICES & INGRESS ==="
          kubectl get svc,ingress